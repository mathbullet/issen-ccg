[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issen-ccg"
version = "0.1.0"
description = "Independently trained compact CCG parser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/mathbullet/issen-ccg"

[project.scripts]
issen-ccg = "issen_ccg.cli.main:main"

[project.optional-dependencies]
infer = ["onnxruntime>=1.20"]
morphology = ["ufal.morphodita>=1.11.3.3,<2"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
